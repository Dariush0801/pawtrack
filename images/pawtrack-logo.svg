<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="pawtrack-circle-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
    <filter id="paw-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  
  <!-- Outer Circular Base -->
  <circle cx="32" cy="32" r="30" fill="url(#pawtrack-circle-grad)" stroke="#fed7aa" stroke-width="2.5"/>
  <circle cx="32" cy="32" r="26.5" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1" stroke-dasharray="3,2"/>
  
  <!-- System Logo Emblem Motif -->
  <g fill="#ffffff" filter="url(#paw-glow)">
    <!-- Top Central Pad -->
    <ellipse cx="32" cy="18" rx="4" ry="5.5"/>
    <!-- Left Pad -->
    <ellipse cx="21" cy="23" rx="3.8" ry="5" transform="rotate(-18 21 23)"/>
    <!-- Right Pad -->
    <ellipse cx="43" cy="23" rx="3.8" ry="5" transform="rotate(18 43 23)"/>
    <!-- Main Center Paw Pad -->
    <path d="M32 30 C25 30 19 35 19 41.5 C19 46.5 23 50 27.5 50 C30.2 50 31.4 48.2 32 48.2 C32.6 48.2 33.8 50 36.5 50 C41 50 45 46.5 45 41.5 C45 35 39 30 32 30 Z"/>
  </g>
</svg>
